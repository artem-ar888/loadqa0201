# Глобальные теги. Можно указать здесь в формате key="value".
# Все метрики будут помечены этими тегами.
# Например: dc = "us-east-1"
[global_tags]
  # dc = "us-east-1"
  # rack = "1a"
  # user = "$USER"

# Основная конфигурация агента Telegraf
[agent]
  ## Интервал сбора метрик
  interval = "60s"
  ## Округлять интервал сбора до значения интервала (например, 10s, 20s)
  round_interval = true
  ## Размер пакета метрик, отправляемого в выходной плагин
  metric_batch_size = 1000
  ## Максимальный размер буфера метрик в памяти
  metric_buffer_limit = 10000
  ## Случайная задержка перед сбором (чтобы избежать пиковых нагрузок)
  collection_jitter = "0s"
  ## Интервал сброса (отправки) накопленных метрик
  flush_interval = "10s"
  ## Случайная задержка перед сбросом
  flush_jitter = "0s"
  precision = ""
  debug = false
  quiet = false
  hostname = ""
  omit_hostname = false

###############################################################################
# ВЫХОДНЫЕ ПЛАГИНЫ (OUTPUTS)
# Куда отправлять собранные метрики.
###############################################################################

# Конфигурация для отправки метрик в InfluxDB
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"] # Замените на адрес вашего InfluxDB
  database = "influx"
  retention_policy = ""
  write_consistency = "any"
  timeout = "5s"

###############################################################################
# ВХОДНЫЕ ПЛАГИНЫ (INPUTS)
# Что именно собирать (мониторинг системы).
###############################################################################

# Метрики использования CPU
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  fielddrop = ["time_*"]

# Метрики использования диска (по точкам монтирования)
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs"]

# Метрики дискового ввода-вывода (IO)
[[inputs.diskio]]

# Статистика ядра из /proc/stat
[[inputs.kernel]]

# Метрики использования оперативной памяти (RAM)
[[inputs.mem]]

# Количество процессов по статусам (running, sleeping, zombie)
[[inputs.processes]]

# Метрики использования swap-памяти
[[inputs.swap]]

# Метрики нагрузки системы и аптайма
[[inputs.system]]

# Метрики использования сетевых интерфейсов
[[inputs.net]]

# Статистика сетевых соединений (netstat)
[[inputs.netstat]]

# Статистика прерываний (interrupts)
[[inputs.interrupts]]

# Файловая система через sysctl (Linux)
[[inputs.linux_sysctl_fs]]